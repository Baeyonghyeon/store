spring:
  application:
    name: bdd-llm
  profiles:
    default: api
  ai:
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      api-key: ${OPENAI_API_KEY:}
      timeout: ${OPENAI_TIMEOUT:60s}
      chat:
        model: ${OPENAI_MODEL:gpt-6-luna}
    deepseek:
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com/v1}
      api-key: ${DEEPSEEK_API_KEY:}
      timeout: ${DEEPSEEK_TIMEOUT:60s}
      chat:
        model: ${DEEPSEEK_MODEL:deepseek-flash}
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55433/bdd_gap}
    username: ${POSTGRES_USER:bdd_gap}
    password: ${POSTGRES_PASSWORD:bdd_gap_local}
    hikari:
      maximum-pool-size: 8
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    baseline-on-migrate: false
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
server:
  port: ${SERVER_PORT:8000}
  error:
    include-message: never
    include-stacktrace: never
  tomcat:
    max-http-form-post-size: 1MB
bdd:
  role: ${BDD_ROLE:api}
  scheduled-retry:
    enabled: ${BDD_SCHEDULED_RETRY_ENABLED:true}
  provider: ${LLM_PROVIDER:ollama}
  model: ${LLM_MODEL:}
  ai:
    ollama-cloud:
      base-url: ${OLLAMA_BASE_URL:https://ollama.com/v1}
      api-key: ${OLLAMA_API_KEY:}
      timeout: ${OLLAMA_TIMEOUT:60s}
      chat:
        model: ${OLLAMA_MODEL:gemma4:31b}
  evidence-config: ${EVIDENCE_CONFIG:config/evidence.toml}
  evidence-root: ${EVIDENCE_ROOT:evidence}
  github-issues:
    enabled: ${GITHUB_ISSUES_ENABLED:true}
    repository: ${GITHUB_ISSUES_REPOSITORY:Baeyonghyeon/noteu}
    service: ${GITHUB_ISSUES_SERVICE:noteu}
    token: ${GITHUB_ISSUES_TOKEN:}
  prompts:
    document-file: ${BDD_DOCUMENT_PROMPT_FILE:bdd-document-analysis-v1.txt}
    test-file: ${BDD_TEST_PROMPT_FILE:bdd-test-analysis-v1.txt}
  locks: ${EXECUTION_LOCK_DIRECTORY:${user.home}/.cache/bdd-gap-analyzer/job-locks}
logging:
  level:
    com.slack.api: ERROR
    org.hibernate.SQL: WARN
---
spring:
  config:
    activate:
      on-profile: migrate
  flyway:
    baseline-version: 6
---
spring:
  config:
    activate:
      on-profile: slack
server:
  port: ${SLACK_PORT:8001}

---
spring:
  config:
    activate:
      on-profile: api
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /docs
    url: /openapi.json

<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>BDD 후보 검토</title>
  <link rel="stylesheet" href="/review-assets/reviews.css">
  <script src="/review-assets/reviews.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#review-detail">검토 내용으로 이동</a>
  <header class="page-header">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">B</span>
      <div><p class="eyebrow">오류에서 다음 테스트로</p><h1>BDD 후보 검토</h1></div>
    </div>
    <div class="reviewer-field">
      <label for="reviewer">검토자 이름</label>
      <input id="reviewer" name="reviewer" type="text" maxlength="80" autocomplete="name" placeholder="검토 이력에 남길 이름" aria-describedby="reviewer-help">
      <span id="reviewer-help">이력에 기록할 표시 이름입니다.</span>
    </div>
  </header>

  <main class="workspace">
    <aside class="job-sidebar" aria-labelledby="jobs-heading">
      <div class="sidebar-heading"><h2 id="jobs-heading">분석 목록</h2><button id="refresh-jobs" class="button button-small button-plain" type="button">새로고침</button></div>
      <p class="muted sidebar-description">분석이 완료된 작업을 검토하세요.</p>
      <div id="jobs-status" class="list-status" role="status" aria-live="polite"></div>
      <nav id="job-list" aria-label="검토할 분석 작업"></nav>
      <button id="load-more" class="button button-secondary load-more" type="button" hidden>이전 작업 더 보기</button>
    </aside>

    <section id="review-detail" class="review-detail" tabindex="-1" aria-label="선택한 분석 검토">
      <div class="empty-state"><span class="empty-mark" aria-hidden="true">⋯</span><h2>분석 목록을 불러오는 중입니다</h2><p>완료된 작업에서 검토할 후보를 확인합니다.</p></div>
    </section>
  </main>
  <footer class="page-footer">승인은 테스트에 반영할 후보를 선택하는 단계입니다. 실제 테스트 구현과 실행은 별도로 진행합니다.</footer>
  <noscript><p class="noscript">후보를 검토하려면 브라우저의 JavaScript를 켜 주세요.</p></noscript>
</body>
</html>

name: bdd-llm-spring
x-app: &app
  image: bdd-llm-spring:local
  build: .
  init: true
  restart: "no"
  environment: &environment
    SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bdd_gap
    POSTGRES_USER: ${POSTGRES_USER:-bdd_gap}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bdd_gap_local}
    LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
    LLM_MODEL: ${LLM_MODEL:-}
    BDD_DOCUMENT_PROMPT_FILE: ${BDD_DOCUMENT_PROMPT_FILE:-bdd-document-analysis-v1.txt}
    GITHUB_ISSUES_ENABLED: ${GITHUB_ISSUES_ENABLED:-true}
    GITHUB_ISSUES_REPOSITORY: ${GITHUB_ISSUES_REPOSITORY:-Baeyonghyeon/noteu}
    GITHUB_ISSUES_SERVICE: ${GITHUB_ISSUES_SERVICE:-noteu}
    BDD_TEST_PROMPT_FILE: ${BDD_TEST_PROMPT_FILE:-bdd-test-analysis-v1.txt}
    OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:31b}
    DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
    OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-luna}
    OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
    DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
    OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
    OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-60s}
    DEEPSEEK_TIMEOUT: ${DEEPSEEK_TIMEOUT:-60s}
    OPENAI_TIMEOUT: ${OPENAI_TIMEOUT:-60s}
    EXECUTION_LOCK_DIRECTORY: /app/locks
  volumes:
    - execution_locks:/app/locks
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bdd_gap
      POSTGRES_USER: ${POSTGRES_USER:-bdd_gap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bdd_gap_local}
    ports: ["127.0.0.1:${DB_PORT:-55433}:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d bdd_gap"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *app
    environment:
      <<: *environment
      BDD_ROLE: migrate
      # Explicitly enabled only after validating/restoring an existing v6 database.
      BDD_BASELINE_EXISTING: ${BDD_BASELINE_EXISTING:-false}
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *app
    environment:
      <<: *environment
      BDD_ROLE: api
      EVIDENCE_CONFIG: /app/config/evidence.toml
      EVIDENCE_ROOT: /app/evidence
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    volumes:
      - execution_locks:/app/locks
      - ./config:/app/config:ro
      - ./evidence:/app/evidence:ro
    healthcheck:
      test: ["CMD", "java", "-cp", "/app", "Healthcheck", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      default: {}
      reporting:
        aliases: ["bdd-analyzer"]

  worker:
    <<: *app
    profiles: ["analysis"]
    restart: unless-stopped
    environment:
      <<: *environment
      BDD_ROLE: worker
      BDD_SCHEDULED_RETRY_ENABLED: ${BDD_SCHEDULED_RETRY_ENABLED:-true}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

  slack:
    <<: *app
    profiles: ["slack"]
    ports: ["127.0.0.1:${SLACK_PORT:-8001}:8001"]
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/bdd_gap
      POSTGRES_USER: ${POSTGRES_USER:-bdd_gap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bdd_gap_local}
      BDD_ROLE: slack
      GITHUB_ISSUES_ENABLED: ${GITHUB_ISSUES_ENABLED:-true}
      GITHUB_ISSUES_REPOSITORY: ${GITHUB_ISSUES_REPOSITORY:-Baeyonghyeon/noteu}
      GITHUB_ISSUES_SERVICE: ${GITHUB_ISSUES_SERVICE:-noteu}
      GITHUB_ISSUES_TOKEN: ${GITHUB_ISSUES_TOKEN:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_CHANNEL_ID: ${SLACK_CHANNEL_ID:-}
      SLACK_REVIEWER_IDS: ${SLACK_REVIEWER_IDS:-}
      BDD_PUBLIC_API_URL: ${BDD_PUBLIC_API_URL:-http://localhost:8000}
      SLACK_MIN_JOB_ID: ${SLACK_MIN_JOB_ID:-1}
      SLACK_POLL_SECONDS: ${SLACK_POLL_SECONDS:-5}

  ngrok:
    image: ngrok/ngrok:3-alpine
    profiles: ["tunnel"]
    init: true
    restart: "no"
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    command: ["http", "http://slack:8001", "--log", "stdout", "--log-format", "json"]
    depends_on:
      slack: { condition: service_started }

  tools:
    <<: *app
    profiles: ["tools"]
    environment:
      <<: *environment
      BDD_ROLE: tools
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - execution_locks:/app/locks
      - ./artifacts:/app/artifacts

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME:-bdd-llm-spring_postgres_data}
    external: ${POSTGRES_VOLUME_EXTERNAL:-false}
  execution_locks:

networks:
  reporting:
    external: true
    name: bdd-error-reporting
